name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']

    name: Test - PHP ${{ matrix.php }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, sqlite3, pdo_sqlite
          coverage: none

      - name: Cache Composer files
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      # Retry on a transient Packagist outage (HTTP 502/504 on the metadata CDN) instead of failing the build.
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            composer update --prefer-dist --no-interaction --no-progress && exit 0
            echo "::warning::composer update failed (attempt $attempt/3) — retrying in 15s (transient Packagist outage?)"
            sleep 15
          done
          exit 1

      - name: Run tests
        run: composer test

  # Cross-engine portability gate (TS-1): the main `test` job runs the FULL suite on SQLite, which uniquely
  # tolerates SQL/DDL that breaks on other engines. This job runs the suite against real PostgreSQL and MySQL so
  # a portability regression fails CI before it reaches a downstream product. Coverage is inclusion-by-default:
  # every test runs cross-engine UNLESS tagged into a deny-list group, never an allow-list. Two groups:
  #   `sqlite-only` — genuinely SQLite-only cases (excluded on every server engine; none today);
  #   `pgsql-skip`  — deferred PostgreSQL-only framework bugs (excluded on the pgsql leg only; MySQL still runs
  #                   them) — see docs/ci/deferred-portability-issues.md. The fast SQLite gate above is unchanged.
  cross-engine:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # exclude_groups is per-engine: pgsql additionally skips the deferred pgsql-only bugs (pgsql-skip).
          - { db: pgsql, port: 5432, exclude_groups: '--exclude-group=sqlite-only --exclude-group=pgsql-skip' }
          - { db: mysql, port: 3306, exclude_groups: '--exclude-group=sqlite-only' }
    name: Cross-engine - ${{ matrix.db }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: root
          POSTGRES_PASSWORD: password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U root -d testing" --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8
        env:
          MYSQL_DATABASE: testing
          MYSQL_ROOT_PASSWORD: password
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent" --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, sqlite3, pdo_sqlite, pdo_pgsql, pdo_mysql
          coverage: none

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            composer update --prefer-dist --no-interaction --no-progress && exit 0
            echo "::warning::composer update failed (attempt $attempt/3) — retrying in 15s (transient Packagist outage?)"
            sleep 15
          done
          exit 1

      - name: Run cross-engine suite on ${{ matrix.db }}
        env:
          DB_CONNECTION: ${{ matrix.db }}
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ matrix.port }}
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: password
        # TS-1: the FULL suite runs cross-engine (inclusion-by-default); only deny-list groups are skipped.
        run: vendor/bin/pest ${{ matrix.exclude_groups }}

  analyse:
    runs-on: ubuntu-latest
    name: Static analysis (Larastan)

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, sqlite3, pdo_sqlite
          coverage: none

      - name: Cache Composer files
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-8.4-${{ hashFiles('composer.json') }}
          restore-keys: composer-8.4-

      # Retry on a transient Packagist outage (HTTP 502/504 on the metadata CDN) instead of failing the build.
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            composer update --prefer-dist --no-interaction --no-progress && exit 0
            echo "::warning::composer update failed (attempt $attempt/3) — retrying in 15s (transient Packagist outage?)"
            sleep 15
          done
          exit 1

      - name: Run Larastan
        run: composer analyse

  js:
    runs-on: ubuntu-latest
    name: JS tests (Vitest)

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run JS tests
        run: npm test
