name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']

    name: Test - PHP ${{ matrix.php }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, sqlite3, pdo_sqlite
          coverage: none

      - name: Cache Composer files
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      # Retry on a transient Packagist outage (HTTP 502/504 on the metadata CDN) instead of failing the build.
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            composer update --prefer-dist --no-interaction --no-progress && exit 0
            echo "::warning::composer update failed (attempt $attempt/3) — retrying in 15s (transient Packagist outage?)"
            sleep 15
          done
          exit 1

      - name: Run tests
        run: composer test

  # Cross-engine portability gate (TS-1): the main `test` job runs the FULL suite on SQLite, which uniquely
  # tolerates SQL/DDL that breaks on other engines. This job runs the suite against real PostgreSQL and MySQL so
  # a portability regression fails CI before it reaches a downstream product. Coverage is inclusion-by-default:
  # every test runs cross-engine UNLESS it is tagged into the `sqlite-only` group (--exclude-group=sqlite-only) —
  # an explicit, reason-tagged deny-list, never an allow-list. Widened incrementally (TS-1 commit 1: the migrating
  # GeneratorTest + the Search/Display suites; commit 2: the full suite). The fast SQLite gate above is unchanged.
  cross-engine:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { db: pgsql, port: 5432 }
          - { db: mysql, port: 3306 }
    name: Cross-engine - ${{ matrix.db }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: root
          POSTGRES_PASSWORD: password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U root -d testing" --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8
        env:
          MYSQL_DATABASE: testing
          MYSQL_ROOT_PASSWORD: password
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent" --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, sqlite3, pdo_sqlite, pdo_pgsql, pdo_mysql
          coverage: none

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            composer update --prefer-dist --no-interaction --no-progress && exit 0
            echo "::warning::composer update failed (attempt $attempt/3) — retrying in 15s (transient Packagist outage?)"
            sleep 15
          done
          exit 1

      - name: Run cross-engine suite on ${{ matrix.db }}
        env:
          DB_CONNECTION: ${{ matrix.db }}
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ matrix.port }}
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: password
        # TS-1 commit 1: the migrating GeneratorTest + the Search/Display suites, minus the sqlite-only deny-list.
        # Commit 2 replaces this file list with the full suite: `vendor/bin/pest --exclude-group=sqlite-only`.
        run: vendor/bin/pest tests/Feature/GeneratorTest.php tests/Feature/SearchTest.php tests/Feature/SearchPortabilityTest.php tests/Feature/DisplayColumnFidelityTest.php tests/Feature/DisplayDescriptorTest.php tests/Feature/DisplayLabelWiringTest.php tests/Feature/ResourceViewConfigTest.php tests/Feature/ExplicitNoneFlagTest.php --exclude-group=sqlite-only

  analyse:
    runs-on: ubuntu-latest
    name: Static analysis (Larastan)

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, sqlite3, pdo_sqlite
          coverage: none

      - name: Cache Composer files
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-8.4-${{ hashFiles('composer.json') }}
          restore-keys: composer-8.4-

      # Retry on a transient Packagist outage (HTTP 502/504 on the metadata CDN) instead of failing the build.
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            composer update --prefer-dist --no-interaction --no-progress && exit 0
            echo "::warning::composer update failed (attempt $attempt/3) — retrying in 15s (transient Packagist outage?)"
            sleep 15
          done
          exit 1

      - name: Run Larastan
        run: composer analyse

  js:
    runs-on: ubuntu-latest
    name: JS tests (Vitest)

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run JS tests
        run: npm test
